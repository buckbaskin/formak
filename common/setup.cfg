[flake8]
exclude = .tox,docs/source/conf.py,*venv
ignore = E501,E203,W503,E266
# Ignore notes:
# E501 ?
# E203 ?
# W503 ?
# E266 ?

[tool:pytest]
addopts = -r=a
python_files = test_*.py *_tests.py
testpaths = test

[isort]
known_first_party=sympy,formak,problemdefinition,runtime_py,data,common_subexpression_elimination,frontend,backend_cpp,backend_py
